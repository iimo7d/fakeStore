<div
  class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200/80 p-8 transition-all"
>
  <!-- Header -->
  <div class="mb-8 text-center">
    <div
      class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 mb-4"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-6 h-6"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
        />
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Welcome Back</h1>
    <p class="text-sm text-slate-500 mt-1">Please sign in to your account</p>
  </div>

  <!-- Form -->
  <form class="space-y-5" (ngSubmit)="onSubmit($event)">
    <!-- Username Field -->
    <div>
      <label for="username" class="block text-sm font-medium text-slate-700 mb-1.5">
        Username or Email
      </label>
      <div class="relative">
        <input
          type="text"
          id="username"
          [formField]="loginForm.username"
          placeholder="e.g. alex@example.com"
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-colors text-sm"
        />
        <app-form-errors
          [control]="loginForm.username()"
          [submitted]="submitted()"
        ></app-form-errors>
      </div>
    </div>

    <!-- Password Field -->
    <div>
      <div class="flex items-center justify-between mb-1.5">
        <label for="password" class="block text-sm font-medium text-slate-700"> Password </label>
        <a
          href="#"
          class="text-xs font-semibold text-indigo-600 hover:text-indigo-500 transition-colors"
        >
          Forgot password?
        </a>
      </div>
      <div class="relative">
        <input
          type="password"
          id="password"
          [formField]="loginForm.password"
          placeholder="••••••••"
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-colors text-sm"
        />
        <app-form-errors
          [control]="loginForm.password()"
          [submitted]="submitted()"
        ></app-form-errors>
      </div>
    </div>

    <!-- Submit Button -->
 <button
  type="submit"
  [disabled]="loginForm().invalid() || isLoading()"
  [attr.aria-busy]="isLoading()"
  appButton
  variant="primary"
  size="md"
  class="w-full mt-2"
>
  @if (isLoading()) {
    <svg
      class="size-4 animate-spin motion-reduce:animate-none"
      viewBox="0 0 24 24"
      fill="none"
      aria-hidden="true"
    >
      <circle
        class="opacity-25"
        cx="12"
        cy="12"
        r="9"
        stroke="currentColor"
        stroke-width="3"
      />

      <path
        class="opacity-90"
        fill="currentColor"
        d="M21 12a9 9 0 0 0-9-9v3a6 6 0 0 1 6 6h3Z"
      />
    </svg>

    <span>Signing in…</span>
  } @else {
    <span>Sign In</span>
  }
</button>
  </form>

  <!-- Footer -->
  <p class="mt-8 text-center text-xs text-slate-500">
    Don't have an account?
    <a
      routerLink="/register"
      class="font-semibold text-indigo-600 hover:text-indigo-500 transition-colors"
      >Create one</a
    >
  </p>
</div>
