<div
  class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200/80 p-8 transition-all"
>
  <!-- Header -->
  <div class="mb-8 text-center">
    <div
      class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 mb-4"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-6 h-6"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"
        />
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Create an Account</h1>
    <p class="text-sm text-slate-500 mt-1">Enter your details to get started</p>
  </div>

  <!-- Form -->
  <form class="space-y-4" (ngSubmit)="onSubmit($event)">
    <!-- Email Field -->
    <div>
      <label for="email" class="block text-sm font-medium text-slate-700 mb-1.5">
        Email Address
      </label>
      <input
        type="email"
        id="email"
        [formField]="registerForm.email"
        placeholder="alex@example.com"
        class="w-full px-4 py-2.5 rounded-lg border border-slate-300 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-colors text-sm"
      />

      <app-form-errors [control]="registerForm.email()" [submitted]="submitted()"></app-form-errors>
    </div>

    <!-- Username Field -->
    <div>
      <label for="username" class="block text-sm font-medium text-slate-700 mb-1.5">
        Username
      </label>
      <input
        type="text"
        id="username"
        [formField]="registerForm.username"
        placeholder="alex99"
        class="w-full px-4 py-2.5 rounded-lg border border-slate-300 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-colors text-sm"
      />
      <app-form-errors
        [control]="registerForm.username()"
        [submitted]="submitted()"
      ></app-form-errors>
    </div>

    <!-- Password Field -->
    <div>
      <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">
        Password
      </label>
      <input
        type="password"
        id="password"
        [formField]="registerForm.password"
        placeholder="••••••••"
        class="w-full px-4 py-2.5 rounded-lg border border-slate-300 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-colors text-sm"
      />
      <app-form-errors
        [control]="registerForm.password()"
        [submitted]="submitted()"
      ></app-form-errors>
    </div>

    <!-- Confirm Password Field -->
    <div>
      <label for="confirmPassword" class="block text-sm font-medium text-slate-700 mb-1.5">
        Confirm Password
      </label>
      <input
        type="password"
        id="confirmPassword"
        [formField]="registerForm.confirmPassword"
        placeholder="••••••••"
        class="w-full px-4 py-2.5 rounded-lg border border-slate-300 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-colors text-sm"
      />
      <app-form-errors
        [control]="registerForm.confirmPassword()"
        [submitted]="submitted()"
      ></app-form-errors>
    </div>

    <!-- Submit Button -->
    <button
      type="submit"
      [disabled]="registerForm().invalid() || isLoading()"
      [attr.aria-busy]="isLoading()"
      appButton
      variant="primary"
      size="md"
      class="w-full mt-6!"
    >
      @if (isLoading()) {
        <svg
          class="size-4 animate-spin motion-reduce:animate-none"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <circle
            class="opacity-25"
            cx="12"
            cy="12"
            r="9"
            stroke="currentColor"
            stroke-width="3"
          />
          <path
            class="opacity-90"
            fill="currentColor"
            d="M21 12a9 9 0 0 0-9-9v3a6 6 0 0 1 6 6h3Z"
          />
        </svg>
        <span>Creating account…</span>
      } @else {
        <span>Sign Up</span>
      }
    </button>
  </form>

  <!-- Footer -->
  <div class="mt-8 text-center text-xs text-slate-500 flex items-center justify-center gap-1">
    <span>Already have an account?</span>
    <a routerLink="/login" appButton variant="link" size="sm">Sign in</a>
  </div>
</div>
